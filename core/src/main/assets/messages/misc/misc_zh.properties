challenges.no_food=缩餐节食
challenges.no_food_desc=食物本就稀缺，但你还需要注意节食！\n\n-使用各类食物与丰饶之角的饱腹效果为原本的三分之一\n-其他恢复饥饿的机制不受影响
challenges.no_armor=信念护体
challenges.no_armor_desc=如今护甲已难堪大用，你只能相信你自己的肉身了！\n\n-布甲之外所有护甲的基本防御力降低\n-所有护甲升级提供的防御力成长大幅降低\n-灵壤守卫的防御力大幅降低
challenges.no_healing=恐药异症
challenges.no_healing_desc=治疗药剂真是种好东西，可惜你对它过敏！\n\n-治疗药剂、以治疗药剂为原料炼制的道具与阳光果将无法治愈英雄，反而会使英雄中毒\n-紊乱魔药不会随机到治愈英雄或使英雄中毒的效果\n-这些道具对其他单位依然发挥正常效果。
challenges.no_herbalism=荒芜之地
challenges.no_herbalism_desc=这个晦气的地牢里连干净的水都没有了...\n\n-移除露珠\n-移除所有特殊植物\n-高草依然会掉落种子，但种子不会生根发芽
challenges.swarm_intelligence=集群智能
challenges.swarm_intelligence_desc=要小心了，地牢里的怪物们也在学习进步！\n\n-每当有敌人发现你或你的盟友时，它们将会吸引附近其他敌人至你所在的位置。\n-初始吸引范围仅有2格，但你每回合暴露于敌方视野中，都会使吸引范围成长2格，且上限为12格。\n-阻断视线可以重置吸引范围，即使是门这类的即时阻断也算数。
challenges.darkness=没入黑暗
challenges.darkness_desc=地牢毕竟是在地下嘛！\n\n-正常视野范围显著缩小\n-每层都会出现一根火把\n-其他光源有效性降至1/5
challenges.no_scrolls=禁忌咒文
challenges.infinity_mobs=无处不在
challenges.infinity_mobs_desc=敌人无处不在！\n\n- 楼层初始敌人的放置目标为原来的100倍，最多放满符合条件的空地\n- 普通房间与走廊可铺满敌人，每格最多一个\n- 特殊房间、特殊地块与原有入口保护范围保留\n- 敌人属性与后续刷新规则不变
challenges.no_scrolls_desc=一种卷轴会变得更稀有。不幸的是，正好还是最有用的那一种。\n\n-移除地牢中半数的升级卷轴
challenges.champion_enemies=精英强敌
challenges.champion_enemies_desc=道高一尺，魔高一丈！\n\n普通敌人生成时会有概率获得特殊的精英强敌效果，概率会从1层的1/8增长至21层的1/6。\n\n-精英强敌不以沉睡状态生成\n-精英强敌生成时英雄会察觉\n-精英强敌无法被转化为盟友\n\n一共有六种精英强敌效果：\n_烈焰(橙)：_近战伤害+25%，攻击时点燃，死亡时起火(不点燃水体)\n_索敌(紫)：_近战伤害+25%，近战范围+3\n_敌法(绿)：_所受伤害-50%，免疫魔法效果\n_巨型(蓝)：_所受伤害-80%，近战范围+1，无法进入门道\n_天佑(黄)：_精准、闪避x4\n_成长(红)：_精准、闪避、攻击伤害与有效生命+20%，每4回合以上属性成长1%
challenges.stronger_bosses=绝命头目
challenges.stronger_bosses_desc=这项挑战会让所有Boss都更具挑战性！\n\n_粘咕：_生命值+20%\n_-_持续处于水中时，生命回复量递增，最高至每回合3点\n_-_爆发攻击蓄力时间由2回合缩短至1回合\n_天狗：_生命+25%\n_-_第一阶段：陷阱更加致命\n_-_第二阶段：技能频率更高\n_DM-300：_生命+33%\n_-_能量塔更坚固，并且需要击毁3座\n_-_技能频率更高，威力也更强大\n_-_超载时速度更快\n_-_地表导线数量为原先的两倍\n_矮人国王：_生命+50%\n_-_所有阶段中都会召唤更多强力随从\n_-_第一阶段：更高的技能与召唤频率\n_-_第二阶段：每轮额外召唤两名随从\n_-_第三阶段：生命值+100%，进一步提高召唤频率\n_Yog-Dzewa：_\n_-_同时召唤两个古神之拳！\n_-_激光攻击伤害+60%\n_-_召唤更强大的随从

rankings$record.something=在黑暗中被击杀
rankings$record.won=获得Yendor护符
rankings$record.ascended=成功携带护符回到地面！

# First playable MMO edition
challenges.loot_paradise=战利品天堂
challenges.loot_paradise_desc=普通楼层随机物品数量变为 5 倍，额外提供 2 份食物。钥匙与任务物品保持原有规则。
challenges.biochip=生物芯片
challenges.biochip_desc=显示真实血量和成长倍率。伤害与防御取区间中值；命中采用累计概率，连续攻击按命中率稳定结算。地图、战利品和特殊效果仍保留随机性。
challenges.mass_loot=大量掉落
challenges.mass_loot_desc=有经验奖励的敌人额外掉落 3～6 件物品，Boss 额外掉落 30 件。包括装备、药剂、升级卷轴与炼金能量。
challenges.unlimited_growth=无限成长
challenges.unlimited_growth_desc=角色 30 级后继续成长，敌人不再因等级差停止提供经验或掉落。武器、防具、法杖、戒指和灵能弓可持续升级；装备超过 +20 后使用科学计数成长层，基础战斗公式与功能数值分开。神器和饰物保留原有机制上限。
challenges.absorption=装备吞噬
challenges.absorption_desc=拾取未诅咒的 +0～+3 普通装备时，自动为对应装备升 1 级：近战武器与护甲合并同类，戒指和法杖要求同名。没有目标则正常入包。独特装备、投掷武器与高级装备不会被吞噬。可单独关闭。
challenges.large_bags=大背包
challenges.large_bags_desc=取消背包容量限制，并提供翻页。每页显示 18 件物品，装备栏保留。物品堆叠数量仍采用原版计数。
challenges.auto_pickup=附近拾取
challenges.auto_pickup_desc=移动后收集周围可见、可到达的 3×3 范围内地面物品，不打开箱子，也不购买商品。吞噬规则同样生效。
challenges.batch_upgrade=批量升级
challenges.batch_upgrade_desc=升级卷轴可以一次使用 1、10、100 张或全部。仅消耗实际拥有的卷轴，整批消耗一回合，诅咒与附魔按照原版逐次升级处理。
challenges.mmo=MMO
challenges.mmo_desc=新楼层根据进入时的角色血量与武器／法杖输出固定怪物成长倍率。保留怪物种类差异与 Boss 阶段；本层成长后可以压制敌人。采用历史最高装备实力避免脱装备降低新楼层难度。召唤敌人沿用本层倍率。
mmo.mmorules.health=生命：%s / %s
mmo.mmorules.scales=伤害倍率：%s\n生命倍率：%s
mmo.mmorules.item_stats=真实强化：+%s\n战斗成长倍率：%s\n原版面板显示基础公式数值，战斗按成长倍率结算。
mmo.mmorules.batch_title=批量强化
mmo.mmorules.batch_desc=强化 %s\n选择使用卷轴数量。整批耗时一回合。
mmo.mmorules.all=全部

mmo.mmorules.recovered=已恢复停滞的动画回调。
